<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محل قطع غيار الهواتف</title>
<style>
:root{--y:#FFC400;--yd:#E6AC00;--yl:#FFF3C4;--r:#D62828;--rd:#B01E1E;--bg:#FFFBF0;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--bd:#e8e2d0;--sh:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;transition:transform .12s,background .15s}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--y);display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:var(--sh)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-size:22px;flex:none}
.top h1{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:#fff;border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-weight:700;position:relative}
.badge{position:absolute;top:-6px;left:-6px;background:var(--r);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.welcome{background:var(--card);border:2px solid var(--y);border-radius:18px;padding:16px;margin-bottom:14px;position:relative;white-space:pre-line;box-shadow:var(--sh)}
.welcome .x{position:absolute;top:8px;left:8px;background:var(--yl);width:34px;height:34px;border-radius:50%}
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--bd);background:#fff;font-size:17px;margin-bottom:14px;box-shadow:var(--sh)}
.search:focus{border-color:var(--y);outline:none}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumb h2{font-size:20px;flex:1;min-width:140px}
.btn{background:var(--y);border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px}
.btn:hover{background:var(--yd)}
.btn.red{background:var(--r);color:#fff}.btn.red:hover{background:var(--rd)}
.btn.ghost{background:#fff;border:2px solid var(--bd)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border-radius:18px;padding:16px 10px;text-align:center;box-shadow:var(--sh);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:120px;justify-content:center;width:100%}
.tile:hover{border-color:var(--y);transform:translateY(-2px)}
.ic{width:56px;height:56px;border-radius:16px;background:var(--yl);display:grid;place-items:center;font-weight:800;font-size:22px;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:contain}
.tile b{font-size:16px;overflow-wrap:anywhere}.tile small{color:var(--mut);overflow-wrap:anywhere}
.tag{display:inline-block;background:var(--yl);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700}
.tag.demo{background:#eee;color:#555}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.pimg{height:130px;background:var(--yl);display:grid;place-items:center;font-size:44px}
.pimg img{width:100%;height:100%;object-fit:contain;background:#fff}
.pbody{padding:14px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.var{border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.q{font-weight:700}.price{font-size:19px;font-weight:800}
.ok{color:#1c1c1c;background:var(--yl)}.no{color:#fff;background:var(--r)}
.st{border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.empty{background:var(--card);border:2px dashed var(--bd);border-radius:18px;padding:30px 16px;text-align:center;color:var(--mut)}
.empty .big{font-size:40px}
footer{background:var(--ink);color:#fff;padding:20px 14px 90px;margin-top:24px;white-space:pre-line}
footer b{color:var(--y)}
.fab{position:fixed;bottom:16px;left:16px;z-index:25;background:var(--r);color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:20px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.drawer{align-items:flex-end}.drawer .modal{border-radius:20px 20px 0 0;max-width:560px}
.line{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.line .nm{flex:1;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:36px;height:36px;border-radius:10px;background:var(--yl);font-weight:800}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;border-right:6px solid var(--y);animation:in .2s}
.toast.bad{border-color:var(--r)}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.fade{animation:in .2s}
#login{position:fixed;inset:0;z-index:80;background:var(--y);display:flex;align-items:center;justify-content:center;padding:16px}
.lbox{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center}
.lbox .logo{margin:0 auto 10px;width:64px;height:64px;font-size:34px;border-radius:20px}
.lbox input{width:100%;padding:13px;border:2px solid var(--bd);border-radius:12px;margin-top:10px;background:var(--bg)}
.pw{position:relative}.pw button{position:absolute;left:6px;top:16px;background:none;font-size:20px;width:40px;height:40px}
.err{color:var(--r);font-weight:700;margin-top:10px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
 <form class="lbox" id="lform" autocomplete="off">
  <div class="logo">📱</div>
  <h2 id="lname"></h2>
  <p style="color:var(--mut)">هلا بيك ضلعي، سجل دخولك وادخل للمحل.</p>
  <input id="lu" placeholder="اسم المستخدم" inputmode="numeric" autocomplete="off" aria-label="اسم المستخدم">
  <div class="pw"><input id="lp" type="password" placeholder="الرمز" autocomplete="off" aria-label="الرمز"><button type="button" id="lshow" aria-label="إظهار أو إخفاء الرمز">👁</button></div>
  <div class="err hide" id="lerr">دير بالك ضلعي، اليوزر او الرمز مو صحيح، جرب مرة ثانية.</div>
  <button class="btn red" style="width:100%;margin-top:14px" type="submit">دخول للمحل</button>
 </form>
</div>

<div id="app" class="hide">
 <header class="top">
  <div class="logo">📱</div><h1 id="sname"></h1>
  <button class="tbtn" id="cartbtn" aria-label="السلة">🛒<span class="badge hide" id="cbadge">0</span></button>
  <button class="tbtn" id="logout">خروج</button>
 </header>
 <main class="wrap">
  <div class="welcome" id="welcome"><button class="x" id="wclose" aria-label="إغلاق">✕</button><span id="wtext"></span></div>
  <input class="search" id="q" type="search" placeholder="🔍 دور: Samsung A15 ، بطارية ، شاشة..." aria-label="بحث">
  <div id="main"></div>
 </main>
 <footer><b id="fname"></b>
<span id="fabout"></span>
<span id="fcontact"></span></footer>
 <button class="fab" id="fab">💬 واتساب</button>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ============ CONFIG (إعدادات تقنية) ============ */
const CONFIG={
 STORE_KEY:'pp_data_v1',   // مفتاح حفظ البيانات في المتصفح (نفسه في admin.html)
 AUTH_KEY:'pp_auth',       // مفتاح حالة الدخول
 CART_KEY:'pp_cart',       // مفتاح السلة
 USER:'0000', PASS:'0000', // دخول محلي بسيط وليس حماية حقيقية
 COUNTRY_CODE:'964',       // رمز العراق
 DEFAULT_WA:'07746520005'  // رقم واتساب الافتراضي (يتعدل من الإدارة)
};
const CAT_NAMES=['شاشة','بطارية','فلات شحن','فلات باور','سماعة مكالمات','سماعة خارجية','مايك','كاميرا أمامية','كاميرا خلفية','شاصي','ضهر الهاتف','أزرار باور وصوت','فلات بصمة','بصمة','فلات شاشة','كونكتر شحن','بوردة شحن','عدسة كاميرا','لواصق ومواد تثبيت','قطع أخرى'];
const CAT_ICONS={'شاشة':'📱','بطارية':'🔋','فلات شحن':'🔌','فلات باور':'⏻','سماعة مكالمات':'👂','سماعة خارجية':'🔊','مايك':'🎤','كاميرا أمامية':'🤳','كاميرا خلفية':'📷','شاصي':'🧱','ضهر الهاتف':'📲','أزرار باور وصوت':'🔘','فلات بصمة':'🧵','بصمة':'👆','فلات شاشة':'📜','كونكتر شحن':'🔗','بوردة شحن':'🧩','عدسة كاميرا':'🔍','لواصق ومواد تثبيت':'🩹','قطع أخرى':'🧰'};
const BRANDS=[['Samsung','سامسونگ'],['Infinix','انفينكس'],['Xiaomi','شاومي'],['Redmi','ريدمي'],['POCO','بوكو'],['iPhone / Apple','ايفون'],['Tecno','تكنو'],['OPPO','اوبو'],['Vivo','فيفو'],['Realme','ريلمي'],['Huawei','هواوي'],['Nokia','نوكيا'],['Motorola','موتورولا'],['Honor','هونر'],['OnePlus','ون بلس'],['Lenovo','لينوفو']];
const DEMO_MODELS={'Samsung':['Galaxy A05','Galaxy A05s','Galaxy A15','Galaxy A25','Galaxy A35','Galaxy A55','Galaxy S21','Galaxy S22 Ultra','Galaxy S23','Galaxy S24'],'Infinix':['Hot Series','Smart Series','Note Series','Zero Series'],'Redmi':['Redmi Series','Redmi Note Series'],'POCO':['POCO Series'],'Xiaomi':['Xiaomi Series']};

/* ============ البيانات ============ */
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function defaults(){
 const d={settings:{shopName:'محل قطع غيار الهواتف',whatsapp:CONFIG.DEFAULT_WA,
  welcome:'هلا وغلا ضلعي، نورت محلنا ❤️\n\nكل قطع غيار الهواتف اللي تحتاجها تلكاها هنا، دور على شركتك وموديل جهازك، اختار القطعة اللي تريدها، ودز طلبك إلنا على الواتساب بكل سهولة.\n\nحياك الله، وخدمتك على راسنا.',
  orderIntro:'السلام عليكم ضلعي، اريد اطلب من عندكم:',orderOutro:'اذا القطعة متوفرة، أكدلي السعر والتوفر وطريقة الاستلام.\n\nشكراً حبيبي.',
  contact:'واتساب: 07746520005',about:'محل لبيع قطع غيار الهواتف لفنيي الصيانة.'},brands:[],models:[],cats:[],parts:[]};
 BRANDS.forEach(([en,ar])=>{const id=uid('b');d.brands.push({id,en,ar,icon:'',hidden:false});(DEMO_MODELS[en]||[]).forEach(m=>d.models.push({id:uid('m'),brandId:id,en:m,ar:'',code:'',hidden:false,demo:true}));});
 CAT_NAMES.forEach(n=>d.cats.push({id:uid('c'),name:n}));
 const m=d.models.find(x=>x.en==='Galaxy A15'),c=n=>d.cats.find(x=>x.name===n).id;
 d.parts.push({id:uid('p'),modelId:m.id,catId:c('شاشة'),name:'شاشة Galaxy A15 (عرض تجريبي)',desc:'بيانات تجريبية لتوضيح التصميم، احذفها من الإدارة.',img:'',demo:true,variants:[{quality:'تجاري درجة أولى',price:25000,qty:null,avail:true,note:''},{quality:'أصلي سحب إذا متوفر',price:45000,qty:null,avail:false,note:''}]});
 return d;
}
function load(){
 try{const raw=localStorage.getItem(CONFIG.STORE_KEY);if(!raw){const d=defaults();save(d);return d}
  const d=JSON.parse(raw);if(!d||!Array.isArray(d.brands)||!Array.isArray(d.models)||!Array.isArray(d.parts)||!Array.isArray(d.cats)||!d.settings)throw 0;return d}
 catch(e){try{localStorage.setItem(CONFIG.STORE_KEY+'_corrupt',localStorage.getItem(CONFIG.STORE_KEY))}catch(_){}
  setTimeout(()=>toast('البيانات المحفوظة تالفة، رجعنا البيانات الافتراضية (نسخة التالف محفوظة).',1),300);const d=defaults();save(d);return d}
}
function save(d){try{localStorage.setItem(CONFIG.STORE_KEY,JSON.stringify(d||D))}catch(e){toast('تعذر الحفظ في المتصفح.',1)}}
let D=load();

/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
function h(t,a={},...c){const e=document.createElement(t);for(const k in a){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v)}c.flat(9).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(x))});return e}
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[گڭک]/g,'ك').replace(/پ/g,'ب').replace(/چ/g,'ج').replace(/\s+/g,' ').trim();
const safeUrl=u=>/^(https?:\/\/|data:image\/)/i.test(u||'')?u:'';
const money=n=>Number(n).toLocaleString('en-US')+' دينار';
function toast(msg,err){const t=h('div',{class:'toast'+(err?' bad':'')},msg);$('#toasts').append(t);setTimeout(()=>t.remove(),3200)}
function confirmBox(msg,okText='تأكيد'){return new Promise(res=>{const o=h('div',{class:'ov'},h('div',{class:'modal'},h('p',{style:'margin-bottom:14px;white-space:pre-line'},msg),h('div',{class:'row'},h('button',{class:'btn red',onclick:()=>{o.remove();res(true)}},okText),h('button',{class:'btn ghost',onclick:()=>{o.remove();res(false)}},'إلغاء'))));document.body.append(o)})}
function waNumber(){let n=String(D.settings.whatsapp||'').replace(/\D/g,'').replace(/^00/,'');if(n.startsWith('0'))n=CONFIG.COUNTRY_CODE+n.slice(1);return n.length>=11?n:''}
function openWA(text){const n=waNumber();if(!n){toast('رقم واتساب المحل غير مضبوط. اضبطه من صفحة الإدارة.',1);return}
 const url='https://wa.me/'+n+'?text='+encodeURIComponent(text);const w=window.open(url,'_blank','noopener');if(!w)location.href=url}
const brandOf=id=>D.brands.find(b=>b.id===id),modelOf=id=>D.models.find(m=>m.id===id),catOf=id=>D.cats.find(c=>c.id===id);
const isAvail=v=>!!v.avail&&(v.qty==null||v.qty===''||Number(v.qty)>0);

/* ============ الدخول ============ */
const authed=()=>localStorage.getItem(CONFIG.AUTH_KEY)==='1';
function gate(){const ok=authed();$('#login').classList.toggle('hide',ok);$('#app').classList.toggle('hide',!ok);if(ok)start()}
$('#lform').addEventListener('submit',e=>{e.preventDefault();if($('#lu').value.trim()===CONFIG.USER&&$('#lp').value===CONFIG.PASS){localStorage.setItem(CONFIG.AUTH_KEY,'1');$('#lerr').classList.add('hide');gate()}else $('#lerr').classList.remove('hide')});
$('#lshow').onclick=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password'};
$('#logout').onclick=()=>{localStorage.removeItem(CONFIG.AUTH_KEY);S={view:'brands'};$('#q').value='';gate()};

/* ============ السلة ============ */
let cart=[];try{cart=JSON.parse(localStorage.getItem(CONFIG.CART_KEY)||'[]');if(!Array.isArray(cart))cart=[]}catch(e){cart=[]}
const saveCart=()=>{try{localStorage.setItem(CONFIG.CART_KEY,JSON.stringify(cart))}catch(e){}updBadge()};
function cartRows(){return cart.map(c=>{const p=D.parts.find(x=>x.id===c.pid),v=p&&p.variants[c.vi];return v?{c,p,v}:null}).filter(Boolean)}
function updBadge(){const n=cartRows().reduce((s,r)=>s+r.c.qty,0);const b=$('#cbadge');b.textContent=n;b.classList.toggle('hide',!n)}
function addCart(p,vi){const f=cart.find(c=>c.pid===p.id&&c.vi===vi);if(f)f.qty++;else cart.push({pid:p.id,vi,qty:1});saveCart();toast('انضافت للسلة ✔')}
function lineText(p,v,q,i){const m=modelOf(p.modelId),b=m&&brandOf(m.brandId),c=catOf(p.catId);
 return (i?i+') ':'')+'الشركة: '+(b?b.en:'-')+'\nالموديل: '+(m?m.en:'-')+'\nالقطعة: '+(c?c.name:'')+(p.name?' - '+p.name:'')+'\nالنوعية: '+(v.quality||'غير محدد')+'\nالسعر المعروض: '+money(v.price)+'\nالكمية: '+q}
function buildOrder(rows){const s=D.settings;const multi=rows.length>1;let t=s.orderIntro+'\n\n'+rows.map((r,i)=>lineText(r.p,r.v,r.c.qty,multi?i+1:0)).join('\n\n');
 if(multi)t+='\n\nالمجموع: '+money(rows.reduce((a,r)=>a+r.v.price*r.c.qty,0));return t+'\n\n'+s.orderOutro+'\n('+s.shopName+')'}
function orderOne(p,vi){openWA(buildOrder([{c:{qty:1},p,v:p.variants[vi]}]))}
function askOne(p,vi){const m=modelOf(p.modelId),b=m&&brandOf(m.brandId);openWA('السلام عليكم ضلعي، اريد اسأل عن توفر هذي القطعة:\n\nالشركة: '+(b?b.en:'-')+'\nالموديل: '+(m?m.en:'-')+'\nالقطعة: '+p.name+'\nالنوعية: '+(p.variants[vi].quality||'-')+'\n\nمتوفرة؟ وشكد السعر؟\n('+D.settings.shopName+')')}
function showCart(){
 const o=h('div',{class:'ov drawer',onclick:e=>{if(e.target===o)o.remove()}});const box=h('div',{class:'modal'});o.append(box);document.body.append(o);
 const draw=()=>{box.replaceChildren();const rows=cartRows();box.append(h('h3',{style:'margin-bottom:8px'},'سلة الطلبات'));
  if(!rows.length){box.append(h('div',{class:'empty'},'السلة فارغة ضلعي.'));box.append(h('button',{class:'btn ghost',style:'width:100%;margin-top:12px',onclick:()=>o.remove()},'إغلاق'));return}
  rows.forEach(r=>{const m=modelOf(r.p.modelId);const q=r.c.qty;
   box.append(h('div',{class:'line'},h('div',{class:'nm'},h('b',{},r.p.name),h('div',{style:'font-size:13px;color:var(--mut)'},(m?m.en:'')+' • '+(r.v.quality||'')+' • '+money(r.v.price))),
    h('div',{class:'qty'},h('button',{onclick:()=>{if(r.c.qty>1)r.c.qty--;saveCart();draw()},'aria-label':'نقص'},'−'),h('b',{},q),h('button',{onclick:()=>{if(r.c.qty<99)r.c.qty++;saveCart();draw()},'aria-label':'زيادة'},'+')),
    h('button',{class:'btn ghost',style:'min-height:36px;padding:4px 10px',onclick:()=>{cart=cart.filter(x=>x!==r.c);saveCart();draw();toast('انحذفت القطعة من السلة')},'aria-label':'حذف'},'🗑')))});
  const tot=rows.reduce((a,r)=>a+r.v.price*r.c.qty,0),cnt=rows.reduce((a,r)=>a+r.c.qty,0);
  box.append(h('p',{style:'margin:12px 0;font-weight:800'},'عدد القطع: '+cnt+' — المجموع: '+money(tot)));
  const un=rows.filter(r=>!isAvail(r.v)).length;if(un)box.append(h('p',{class:'err',style:'margin:0 0 10px'},'تنبيه: بالسلة قطع صارت غير متوفرة حالياً، احذفها قبل الطلب.'));
  box.append(h('div',{class:'row'},h('button',{class:'btn red',disabled:un?'':null,onclick:()=>{openWA(buildOrder(rows));toast('تجهز الطلب بواتساب، اضغط إرسال هناك حتى يوصلنا.')}},'إرسال الطلب للواتساب'),h('button',{class:'btn ghost',onclick:()=>o.remove()},'إغلاق')))};
 draw()}
$('#cartbtn').onclick=showCart;

/* ============ العرض ============ */
let S={view:'brands'};
const go=(s)=>{S=s;$('#q').value='';render();window.scrollTo({top:0,behavior:'smooth'})};
function icon(b){const u=safeUrl(b.icon);const box=h('div',{class:'ic'});
 if(u){const i=h('img',{src:u,alt:'',loading:'lazy'});i.onerror=()=>{i.remove();box.textContent=b.en.charAt(0)};box.append(i)}else box.textContent=b.icon&&!/^https?:/i.test(b.icon)?b.icon:b.en.charAt(0).toUpperCase();return box}
function tile(ic,title,sub,fn){return h('button',{class:'tile fade',onclick:fn},ic,h('b',{},title),sub?h('small',{},sub):null)}
function crumb(title,back,backText){return h('div',{class:'crumb'},back?h('button',{class:'btn ghost',onclick:back},'→ '+backText):null,h('h2',{},title),h('button',{class:'btn ghost',onclick:()=>go({view:'brands'})},'كل الشركات'))}
const empty=(msg,ic='🔎')=>h('div',{class:'empty'},h('div',{class:'big'},ic),h('p',{},msg),h('button',{class:'btn',style:'margin-top:12px',onclick:()=>openWA('السلام عليكم ضلعي، اريد اسأل عن توفر قطعة.\n('+D.settings.shopName+')')},'راسلنا على الواتساب'));
const modelsOf=bid=>D.models.filter(m=>m.brandId===bid&&!m.hidden);
const visBrands=()=>D.brands.filter(b=>!b.hidden);

function render(){const el=$('#main');el.replaceChildren();const q=norm($('#q').value);
 if(q)return renderSearch(el,q);
 if(S.view==='brands'){el.append(h('div',{class:'grid'},visBrands().map(b=>tile(icon(b),b.en,(b.ar?b.ar+' • ':'')+modelsOf(b.id).length+' موديل',()=>go({view:'models',brandId:b.id})))));if(!visBrands().length)el.append(empty('ماكو شركات مضافة هسه.'))}
 else if(S.view==='models'){const b=brandOf(S.brandId);if(!b)return go({view:'brands'});const ms=modelsOf(b.id);
  el.append(crumb(b.en+' — '+ms.length+' موديل',()=>go({view:'brands'}),'الشركات'));
  const f=h('input',{class:'search',placeholder:'ابحث داخل موديلات '+b.en,'aria-label':'بحث بالموديلات'});const g=h('div',{class:'grid'});
  const draw=()=>{g.replaceChildren();const k=norm(f.value);const l=ms.filter(m=>!k||k.split(' ').every(w=>norm(m.en+' '+m.ar+' '+m.code).includes(w)));l.forEach(m=>g.append(tile(h('div',{class:'ic'},'📱'),m.en,[m.ar,m.demo?'بيانات تجريبية':''].filter(Boolean).join(' • '),()=>go({view:'cats',brandId:b.id,modelId:m.id}))));if(!l.length)g.append(empty('ماكو موديلات مطابقة.'))};
  f.oninput=draw;el.append(f,g);draw()}
 else if(S.view==='cats'){const m=modelOf(S.modelId),b=m&&brandOf(m.brandId);if(!m)return go({view:'brands'});
  el.append(crumb(b.en+' '+m.en,()=>go({view:'models',brandId:b.id}),'الموديلات'));
  el.append(h('div',{class:'grid'},D.cats.map(c=>{const n=D.parts.filter(p=>p.modelId===m.id&&p.catId===c.id).length;return tile(h('div',{class:'ic'},CAT_ICONS[c.name]||'🔧'),c.name,n?n+' قطعة':'ماكو قطع',()=>go({view:'parts',brandId:b.id,modelId:m.id,catId:c.id}))})))}
 else if(S.view==='parts'){const m=modelOf(S.modelId),c=catOf(S.catId),b=m&&brandOf(m.brandId);if(!m||!c)return go({view:'brands'});
  el.append(crumb(c.name+' — '+m.en,()=>go({view:'cats',brandId:b.id,modelId:m.id}),'الأقسام'));
  const ps=D.parts.filter(p=>p.modelId===m.id&&p.catId===c.id);
  el.append(ps.length?h('div',{class:'parts'},ps.map(partCard)):empty('هسه ما عدنا قطع مسجلة لهذا القسم ضلعي، راسلنا على الواتساب ونتأكدلك من التوفر.','📭'))}}

function renderSearch(el,q){const ws=q.split(' ');const m_=m=>{const b=brandOf(m.brandId);return norm((b?b.en+' '+b.ar:'')+' '+m.en+' '+m.ar+' '+m.code)};
 const ms=D.models.filter(m=>!m.hidden&&brandOf(m.brandId)&&!brandOf(m.brandId).hidden&&ws.every(w=>m_(m).includes(w)));
 const ps=D.parts.filter(p=>{const m=modelOf(p.modelId);if(!m||m.hidden)return false;const c=catOf(p.catId);const hay=m_(m)+' '+norm(p.name+' '+p.desc+' '+(c?c.name:'')+' '+p.variants.map(v=>v.quality+' '+v.note).join(' '));return ws.every(w=>hay.includes(w))});
 el.append(h('h2',{style:'margin-bottom:10px'},'نتائج البحث'));
 if(ms.length){el.append(h('h3',{style:'margin:8px 0'},'الموديلات ('+ms.length+')'),h('div',{class:'grid'},ms.slice(0,24).map(m=>{const b=brandOf(m.brandId);return tile(h('div',{class:'ic'},'📱'),m.en,b.en,()=>go({view:'cats',brandId:b.id,modelId:m.id}))})))}
 if(ps.length)el.append(h('h3',{style:'margin:14px 0 8px'},'القطع ('+ps.length+')'),h('div',{class:'parts'},ps.slice(0,60).map(partCard)));
 if(!ms.length&&!ps.length)el.append(empty('ماكو نتائج مطابقة ضلعي. جرب كلمة ثانية، أو راسلنا نتأكدلك من التوفر.'))}

function partCard(p){const m=modelOf(p.modelId),b=m&&brandOf(m.brandId),c=catOf(p.catId);
 const box=h('div',{class:'pimg'},CAT_ICONS[c&&c.name]||'🔧');const u=safeUrl(p.img);if(u){const i=h('img',{src:u,alt:p.name,loading:'lazy'});i.onerror=()=>i.remove();i.onload=()=>box.firstChild&&box.firstChild.nodeType===3&&box.firstChild.remove();box.append(i)}
 return h('article',{class:'pcard fade'},box,h('div',{class:'pbody'},
  h('b',{style:'font-size:17px'},p.name),h('div',{style:'color:var(--mut);font-size:14px'},(b?b.en:'')+' / '+(m?m.en:'')+' • '+(c?c.name:'')),
  p.demo?h('span',{class:'tag demo'},'بيانات تجريبية'):null,p.desc?h('div',{style:'font-size:14px'},p.desc):null,
  p.variants.length?p.variants.map((v,i)=>{const av=isAvail(v);return h('div',{class:'var'},h('div',{class:'q'},v.quality||'غير محدد'),h('div',{class:'row',style:'align-items:center'},h('span',{class:'price'},money(v.price)),h('span',{class:'st '+(av?'ok':'no')},av?'متوفر':'غير متوفر حالياً')),
   v.note?h('div',{style:'font-size:13px;color:var(--mut)'},v.note):null,
   av?h('div',{class:'row'},h('button',{class:'btn red',onclick:()=>orderOne(p,i)},'اطلبها على الواتساب'),h('button',{class:'btn',onclick:()=>addCart(p,i)},'أضف للسلة')):h('button',{class:'btn ghost',onclick:()=>askOne(p,i)},'استفسر عن التوفر'))}):h('div',{class:'empty'},'ماكو نوعيات مسجلة.')))}

/* ============ تشغيل ============ */
function start(){const s=D.settings;$('#sname').textContent=s.shopName;$('#fname').textContent=s.shopName;$('#fabout').textContent='\n'+s.about;$('#fcontact').textContent='\n'+s.contact;document.title=s.shopName;
 $('#wtext').textContent=s.welcome;$('#welcome').classList.toggle('hide',sessionStorage.getItem('pp_w')==='1');updBadge();render()}
$('#wclose').onclick=()=>{sessionStorage.setItem('pp_w','1');$('#welcome').classList.add('hide')};
$('#q').addEventListener('input',render);
$('#fab').onclick=()=>openWA('السلام عليكم ضلعي، عندي استفسار.\n('+D.settings.shopName+')');
$('#lname').textContent=D.settings.shopName;
window.addEventListener('storage',e=>{if(e.key===CONFIG.STORE_KEY){D=load();if(authed())start()}});
gate();
</script>
</body>
</html>
